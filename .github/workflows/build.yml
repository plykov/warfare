name: Build and verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verify engine version
        shell: pwsh
        run: godot --version

      - name: Run project checks
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/verify.ps1

      - name: Export Windows release
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/build_windows.ps1

      - name: Smoke-test exported executable
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/smoke_windows.ps1

      - name: Add player instructions
        shell: pwsh
        run: Copy-Item README.md build/README.md

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Garden-Reclaimed-Windows
          path: |
            build/Garden-Reclaimed.exe
            build/README.md
          if-no-files-found: error
          retention-days: 14
